name: Abrir ou Atualizar PR da develop

on:
  push:
    branches:
      - develop

jobs:
  pr:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Lê o .raffver e grava título + corpo em arquivos temporários
      # (evita qualquer interpolação de aspas no shell)
      # ---------------------------------------------------------------
      - name: Ler .raffver e gravar arquivos de título e corpo
        shell: python
        run: |
          import os
          import re
          import textwrap

          with open(".raffver", "r", encoding="utf-8") as f:
              conteudo = f.read()

          linhas = conteudo.splitlines()

          campos = {}
          indice_divisor = None
          for i, linha in enumerate(linhas):
              if "=" not in linha and re.search(r"-", linha):
                  indice_divisor = i
                  break
              if "=" in linha:
                  chave, _, valor = linha.partition("=")
                  campos[chave.strip().upper()] = valor.strip()

          # VERSION
          versao_raw = re.sub(r"(?i)^v", "", campos.get("VERSION", "0").strip().strip('"\''))
          versao = f"V{versao_raw}"

          # NIGHTLY
          nightly_raw = campos.get("NIGHTLY", "false").strip().lower().strip('"\'')
          eh_nightly = nightly_raw in ("true", "1", "yes", "sim")

          # TITLE
          titulo_raw = campos.get("TITLE", "").strip().strip('"\'').strip()
          titulo = f'"{titulo_raw}"' if titulo_raw else '""'

          # Nome formatado
          if eh_nightly:
              nome_release = f"[{versao} NIGHTLY] {titulo}"
          else:
              nome_release = f"[{versao}] {titulo}"

          # Itens do log
          itens = []
          if indice_divisor is not None:
              for linha in linhas[indice_divisor + 1:]:
                  linha = linha.strip()
                  if not linha:
                      continue
                  if linha.startswith("(write") or linha.startswith("(escreva"):
                      continue
                  linha = re.sub(r"^[-*]\s*", "", linha).strip()
                  if linha:
                      itens.append(f"* {linha}")

          corpo_lista = "\n".join(itens) if itens else "* Sem notas de versão ainda."

          pr_corpo = textwrap.dedent(f"""\
          ## {nome_release}

          ### O que muda nessa versão

          {corpo_lista}

          ---
          > Descrição gerada automaticamente a partir do `.raffver`. Edite o arquivo para atualizar.
          """)

          # Grava em arquivos — sem passar nada pelo shell
          with open("/tmp/pr_titulo.txt", "w", encoding="utf-8") as f:
              f.write(nome_release)

          with open("/tmp/pr_corpo.md", "w", encoding="utf-8") as f:
              f.write(pr_corpo)

          print(f"Título: {nome_release}")
          print(f"Corpo:\n{pr_corpo}")

      # ---------------------------------------------------------------
      # Verifica se já existe um PR aberto de develop → main
      # ---------------------------------------------------------------
      - name: Verificar PR existente
        id: checar_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          numero=$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number // ""')
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          if [ -n "$numero" ]; then
            echo "PR existente: #$numero"
          else
            echo "Nenhum PR aberto encontrado."
          fi

      # ---------------------------------------------------------------
      # Abre um novo PR (somente se não existir nenhum)
      # ---------------------------------------------------------------
      - name: Abrir PR
        if: steps.checar_pr.outputs.numero == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "$(cat /tmp/pr_titulo.txt)" \
            --body-file /tmp/pr_corpo.md

      # ---------------------------------------------------------------
      # Atualiza o PR existente (título + corpo) a cada novo commit
      # ---------------------------------------------------------------
      - name: Atualizar PR existente
        if: steps.checar_pr.outputs.numero != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.checar_pr.outputs.numero }}" \
            --title "$(cat /tmp/pr_titulo.txt)" \
            --body-file /tmp/pr_corpo.md
